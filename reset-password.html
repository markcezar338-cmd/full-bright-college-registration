<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Fullbright College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <script>
    // Capture the recovery URL before supabase-js removes the token fragments.
    window.__initialAuthUrl = window.location.href;
  </script>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="images/logo.svg" alt="Fullbright College Logo">
      <h4>Fullbright College</h4>
      <p>Student Registration System</p>
    </div>

    <div id="resetPasswordAlert" class="alert alert-info" role="alert">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      <span id="resetPasswordAlertText">Verifying your reset link...</span>
    </div>

    <div id="resetPasswordSection" class="d-none">
      <h5 class="text-center mb-2">Set a New Password</h5>
      <p class="text-center mb-4" style="font-size: 0.9rem; color: var(--text-light);">
        For <strong id="resetPasswordEmail">your account</strong>
      </p>

      <form id="resetPasswordForm">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPassword" placeholder="Minimum 6 characters" autocomplete="new-password" required>
          <div class="password-strength" id="passwordStrength"></div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="resetPasswordBtn">
          <i class="fas fa-key me-2"></i>Update Password
        </button>
      </form>
    </div>

    <div class="text-center mt-3">
      <p class="mb-0"><a href="login.html">Back to Login</a></p>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="resetPasswordLoading">
    <div class="spinner"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
