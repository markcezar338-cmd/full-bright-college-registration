<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fullbright College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="images/logo.png" alt="Fullbright College Logo" onerror="this.style.display='none'">
      <h4>Fullbright College</h4>
      <p>Student Registration System</p>
    </div>

    <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="userType" class="form-label">Login As</label>
        <select class="form-select" id="userType" required>
          <option value="student">Student</option>
          <option value="registrar">Registrar</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        <div class="invalid-feedback"></div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        <div class="invalid-feedback"></div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
        <a href="#" id="forgotPasswordLink" class="text-decoration-none">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="loginBtn">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
    </form>

    <div class="text-center mt-3">
      <p class="mb-0">Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <div class="text-center mt-2">
      <p class="mb-0" style="font-size: 0.8rem; color: var(--text-light);">
        <a href="index.html" class="text-decoration-none">Back to Home</a>
      </p>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loginLoading">
    <div class="spinner"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
