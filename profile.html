<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Fullbright College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="images/logo.png" alt="Fullbright College Logo" onerror="this.style.display='none'">
        <span>Fullbright College</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1>My Profile</h1>
        <p>View and manage your personal information</p>
      </div>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="card text-center">
            <div class="card-body">
              <div class="profile-avatar-wrapper mx-auto mb-3">
                <img src="images/default-avatar.png" alt="Profile Picture" class="profile-avatar" id="profileAvatar" onerror="this.src='images/default-avatar.png'">
              </div>
              <h4 id="profileName">Loading...</h4>
              <p class="text-muted" id="profileStudentNumber">N/A</p>
              <span class="role-badge bg-primary text-white" id="profileRole">Student</span>
              <p class="text-muted mt-2" style="font-size:0.8rem;" id="profileEmail">N/A</p>
              <button class="btn btn-outline-primary btn-sm mt-2" id="editProfileBtn">
                <i class="fas fa-edit me-1"></i> Edit Profile
              </button>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card">
            <div class="card-header">Personal Information</div>
            <div class="card-body">
              <form id="profileForm">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label">Student Number</label>
                    <input type="text" class="form-control" id="profileStudentNumber" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" id="profileFirstName">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="profileLastName">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Birthday</label>
                    <input type="date" class="form-control" id="profileBirthday" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-control" id="profileAge" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <input type="text" class="form-control" id="profileGender" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="profileEmailInput" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="profilePhone">
                  </div>
                  <div class="col-12">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" id="profileAddress">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Province</label>
                    <input type="text" class="form-control" id="profileProvince" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" id="profileCity" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Barangay</label>
                    <input type="text" class="form-control" id="profileBarangay" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Course</label>
                    <input type="text" class="form-control" id="profileCourse" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Year Level</label>
                    <input type="text" class="form-control" id="profileYearLevel" readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Section</label>
                    <input type="text" class="form-control" id="profileSection" readonly>
                  </div>
                </div>
                <div class="mt-3">
                  <button type="button" class="btn btn-primary" id="saveProfileBtn">
                    <i class="fas fa-save me-1"></i> Save Changes
                  </button>
                  <button type="button" class="btn btn-outline-secondary" id="cancelProfileBtn">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container text-center">
      <p style="font-size:0.8rem;">&copy; 2026 Fullbright College. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/profile.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
