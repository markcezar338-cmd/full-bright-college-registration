<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found - Fullbright College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <div class="d-flex align-items-center justify-content-center min-vh-100 text-center">

        <h1 class="display-1 text-primary fw-bold">404</h1>
        <h2>Page Not Found</h2>

        <div class="d-flex gap-3 justify-content-center">
          <a href="index.html" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i>Go Home
          </a>
          <a href="login.html" class="btn btn-outline-primary btn-lg">

      </div>
